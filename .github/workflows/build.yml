name: Build Openterface Keyboard and Mouse emulator firmware

on:
  push:
    branches:
      - main
      - 'feature/*'
  workflow_call:
    inputs:
      enable_ble:
        description: Enable Bluetooth Low Energy (BLE)
        required: false
        default: '1'
        type: string
  workflow_dispatch:
    inputs:
      enable_ble:
        description: Enable Bluetooth Low Energy (BLE)
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '0'

env:
  SOURCE_DIR: ${{ github.workspace }}
  BUILD_DIR: ${{ github.workspace }}\build
  OUTPUT_DIR: ${{ github.workspace }}\output
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RISC_COMPILER_VERSION: 8.2.0-3.1.1
  ENABLE_BLE: ${{ inputs.enable_ble || github.event.inputs.enable_ble || '1' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create output directory
      run: New-Item -ItemType Directory -Path "${{ env.OUTPUT_DIR }}" -Force

    - name: Cache chocolatey packages
      uses: actions/cache@v4
      with:
        path: C:\ProgramData\chocolatey\lib
        key: ${{ runner.os }}-choco-${{ hashFiles('**/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-choco-

    - name: Install build dependencies
      run: |
        choco install -y make wget unzip
        echo "C:\\ProgramData\\chocolatey\\bin" >> $GITHUB_PATH

    - name: Cache RISC-V compiler
      uses: actions/cache@v4
      id: cache-risc-compiler
      with:
        path: C:\tools\risc-none-embed-gcc
        key: ${{ runner.os }}-risc-compiler-${{ env.RISC_COMPILER_VERSION }}

    - name: Check cache status
      run: |
        if ("${{ steps.cache-risc-compiler.outputs.cache-hit }}" -eq "true") {
          Write-Host "✓ Cache HIT: Using cached RISC-V compiler" -ForegroundColor Green
        } else {
          Write-Host "✗ Cache MISS: Downloading fresh RISC-V compiler" -ForegroundColor Yellow
        }

    - name: Clone risc-none-embed-gcc and configure environment
      if: steps.cache-risc-compiler.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/openwch/risc-none-embed-gcc/archive/refs/tags/8.2.0.zip 
        unzip 8.2.0.zip
        move risc-none-embed-gcc-8.2.0 c:\\tools\\risc-none-embed-gcc

    - name: Configure compiler environment
      run: |
        echo "RISC_COMPILER_PATH=C:\\tools\\risc-none-embed-gcc\\risc-none-embed-gcc-${{ env.RISC_COMPILER_VERSION }}" >> $GITHUB_ENV
        echo "C:\\tools\\risc-none-embed-gcc\\bin" >> $GITHUB_PATH
        echo "RISC_COMPILER_PATH=C:\\tools\\risc-none-embed-gcc" >> $GITHUB_ENV

    - name: Build KVMGo (version 1)
      run: |
        echo "Building KVMGo..."
        echo "Feature flags: ENABLE_BLE=${{ env.ENABLE_BLE }}"

        # Build
        cd build
        $env:PATH = "C:\tools\risc-none-embed-gcc\bin;" + $env:PATH
        $env:RISC_COMPILER_PATH = "C:\tools\risc-none-embed-gcc"
        make clean
        make -j4 ENABLE_BLE=${{ env.ENABLE_BLE }} BOARD_VERSION=1 all
        riscv-none-embed-objcopy -O binary "openterface-km-firmware.elf" "openterface-km-firmware.bin"
        riscv-none-embed-size --format=berkeley openterface-km-firmware.elf | Out-File -Encoding ascii openterface-km-firmware.siz
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✓ KVMGo build succeeded" -ForegroundColor Green
        } else {
          Write-Host "✗ KVMGo build failed with exit code $LASTEXITCODE" -ForegroundColor Red
          exit 1
        }

        # Copy artifact with version suffix to output directory
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.hex" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-kvmgo.hex"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.bin" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-kvmgo.bin"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.elf" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-kvmgo.elf"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.map" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-kvmgo.map"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.siz" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-kvmgo.siz"

    - name: Build Mini-KVM v1.2 (version 2)
      run: |
        echo "Building Mini-KVM v1.2..."
        echo "Feature flags: ENABLE_BLE=${{ env.ENABLE_BLE }}"

        # Build
        cd build
        $env:PATH = "C:\tools\risc-none-embed-gcc\bin;" + $env:PATH
        $env:RISC_COMPILER_PATH = "C:\tools\risc-none-embed-gcc"
        make clean
        make -j4 ENABLE_BLE=${{ env.ENABLE_BLE }} BOARD_VERSION=2 all
        riscv-none-embed-objcopy -O binary "openterface-km-firmware.elf" "openterface-km-firmware.bin"
        riscv-none-embed-size --format=berkeley openterface-km-firmware.elf | Out-File -Encoding ascii openterface-km-firmware.siz
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✓ Mini-KVM v1.2 build succeeded" -ForegroundColor Green
        } else {
          Write-Host "✗ Mini-KVM v1.2 build failed with exit code $LASTEXITCODE" -ForegroundColor Red
          exit 1
        }

        # Copy artifact with version suffix to output directory
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.hex" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-mini-kvm.hex"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.bin" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-mini-kvm.bin"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.elf" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-mini-kvm.elf"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.map" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-mini-kvm.map"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.siz" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-mini-kvm.siz"

    - name: Build KeyMod Plus (version 3, external oscillator)
      run: |
        echo "Building KeyMod Plus..."
        echo "Feature flags: ENABLE_BLE=1, ENABLE_OSCILLATOR=1"

        # Build
        cd build
        $env:PATH = "C:\tools\risc-none-embed-gcc\bin;" + $env:PATH
        $env:RISC_COMPILER_PATH = "C:\tools\risc-none-embed-gcc"
        make clean
        make -j4 ENABLE_BLE=1 ENABLE_OSCILLATOR=1 BOARD_VERSION=3 BLE_NAME=KeyMod USB_WORK_MODE=hid_acm_ecm_bridge all
        riscv-none-embed-objcopy -O binary "openterface-km-firmware.elf" "openterface-km-firmware.bin"
        riscv-none-embed-size --format=berkeley openterface-km-firmware.elf | Out-File -Encoding ascii openterface-km-firmware.siz
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✓ KeyMod Plus build succeeded" -ForegroundColor Green
        } else {
          Write-Host "✗ KeyMod Plus build failed with exit code $LASTEXITCODE" -ForegroundColor Red
          exit 1
        }

        # Copy artifact with version suffix to output directory
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.hex" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-plus.hex"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.bin" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-plus.bin"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.elf" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-plus.elf"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.map" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-plus.map"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.siz" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-plus.siz"

    - name: Build KeyMod Mini (version 3, internal RC oscillator)
      run: |
        echo "Building KeyMod Mini..."
        echo "Feature flags: ENABLE_BLE=1, ENABLE_OSCILLATOR=0"

        # Build
        cd build
        $env:PATH = "C:\tools\risc-none-embed-gcc\bin;" + $env:PATH
        $env:RISC_COMPILER_PATH = "C:\tools\risc-none-embed-gcc"
        make clean
        make -j4 ENABLE_BLE=1 ENABLE_OSCILLATOR=0 BOARD_VERSION=3 BLE_NAME=KeyMod USB_WORK_MODE=hid_ecm_bridge all
        riscv-none-embed-objcopy -O binary "openterface-km-firmware.elf" "openterface-km-firmware.bin"
        riscv-none-embed-size --format=berkeley openterface-km-firmware.elf | Out-File -Encoding ascii openterface-km-firmware.siz
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✓ KeyMod Mini build succeeded" -ForegroundColor Green
        } else {
          Write-Host "✗ KeyMod Mini build failed with exit code $LASTEXITCODE" -ForegroundColor Red
          exit 1
        }

        # Copy artifact with version suffix to output directory
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.hex" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-mini.hex"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.bin" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-mini.bin"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.elf" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-mini.elf"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.map" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-mini.map"
        Copy-Item "${{ env.BUILD_DIR }}\openterface-km-firmware.siz" "${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-mini.siz"

    - name: Upload KVMGo firmware
      uses: actions/upload-artifact@v4
      with:
        name: openterface-km-firmware-kvmgo
        if-no-files-found: error
        retention-days: 7
        path: |
          ${{ env.OUTPUT_DIR }}\openterface-km-firmware-kvmgo.hex
          ${{ env.OUTPUT_DIR }}\openterface-km-firmware-kvmgo.bin

    - name: Upload Mini-KVM v1.2 firmware
      uses: actions/upload-artifact@v4
      with:
        name: openterface-km-firmware-mini-kvm-v1.2
        if-no-files-found: error
        retention-days: 7
        path: |
          ${{ env.OUTPUT_DIR }}\openterface-km-firmware-mini-kvm.hex
          ${{ env.OUTPUT_DIR }}\openterface-km-firmware-mini-kvm.bin

    - name: Upload KeyMod Plus firmware (external oscillator)
      uses: actions/upload-artifact@v4
      with:
        name: openterface-km-firmware-keymod-plus
        if-no-files-found: error
        retention-days: 7
        path: |
          ${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-plus.hex
          ${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-plus.bin

    - name: Upload KeyMod Mini firmware (internal RC oscillator)
      uses: actions/upload-artifact@v4
      with:
        name: openterface-km-firmware-keymod-mini
        if-no-files-found: error
        retention-days: 7
        path: |
          ${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-mini.hex
          ${{ env.OUTPUT_DIR }}\openterface-km-firmware-keymod-mini.bin

